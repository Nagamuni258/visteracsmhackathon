plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace = "com.roadbump.app"
    compileSdk = 36

    defaultConfig {
        applicationId "com.roadbump.app"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
        aaptOptions {
            noCompress 'tflite', 'lite'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            isDebuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs += [
            '-Xopt-in=kotlin.RequiresOptIn',
            '-Xopt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-Xopt-in=androidx.lifecycle.LifecycleBuilder',
            '-Xopt-in=androidx.camera.camera2.interop.ExperimentalCamera2Interop',
        ]
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.6.0'
    }

    buildFeatures {
        compose = true
        viewBinding = true
        dataBinding = true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/*.kotlin_module'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            storeFile file('keystore/roadbump-release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'roadbump-key'
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.7'

    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material3:material3-window-size-class:1.3.1'
    implementation 'androidx.compose.ui:ui:1.7.3'
    implementation 'androidx.compose.ui:ui-graphics:1.7.3'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.3'
    implementation 'androidx.compose.ui:ui-tooling:1.7.3'
    implementation 'androidx.compose.runtime:runtime-livedata:1.7.3'
    implementation 'androidx.compose.runtime:runtime-rxjava3:1.7.3'

    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-mlkit-vision:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-gpu-delegate-plugin:2.16.1'

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:${room_version}"
    implementation "androidx.room:room-ktx:${room_version}"
    kapt "androidx.room:room-compiler:${room_version}"

    implementation platform('com.google.firebase:firebase-bom:33.11.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'

    implementation 'io.coil-kt:coil-compose:2.7.0'

    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    def work_version = "2.9.1"
    implementation "androidx.work:work-runtime-ktx:${work_version}"

    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'

    implementation 'androidx.biometric:biometric:1.2.0-alpha04'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.3'
    androidTestImplementation 'androidx.compose.ui:ui-test-manifest:1.7.3'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.3'
    debugImplementation 'androidx.compose.ui:ui-tooling-preview:1.7.3'
}

kapt {
    correctErrorTypes = true
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '11'
    }
}